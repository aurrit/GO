{{define "content"}}
<h2>Мои траты</h2>

<form method="GET" action="/">
    <label>Категория:
        <select name="category">
            <option value="0">Все категории</option>
            {{range .Categories}}
            <option value="{{.ID}}" {{if eq .ID $.Filter.CategoryID}}selected{{end}}>{{.Name}}</option>
            {{end}}
        </select>
    </label>
    <label>С: <input type="date" name="from" value="{{.Filter.DateFrom}}"></label>
    <label>По: <input type="date" name="to" value="{{.Filter.DateTo}}"></label>
    <button type="submit">Фильтровать</button>
    <a href="/">Сбросить</a>
</form>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Сумма</th>
        <th>Описание</th>
        <th>Категория</th>
        <th>Дата</th>
        <th>Действия</th>
    </tr>
    {{range .Expenses}}
    <tr>
        <td>{{.ID}}</td>
        <td>{{.Amount}}</td>
        <td>{{.Description}}</td>
        <td>{{.CategoryName}}</td>
        <td>{{.Date}}</td>
        <td>
            <a href="/edit?id={{.ID}}">Редактировать</a>
            <form method="POST" action="/delete" style="display:inline" onsubmit="return confirm('Удалить трату?');">
                <input type="hidden" name="id" value="{{.ID}}">
                <button type="submit">Удалить</button>
            </form>
        </td>
    </tr>
    {{end}}
</table>

<h3>Добавить трату</h3>
<form method="POST" action="/add">
    <label>Сумма: <input type="number" step="0.01" name="amount" required></label><br>
    <label>Описание: <input type="text" name="description" required></label><br>
    <label>Категория:
        <select name="category_id">
            <option value="0">Без категории</option>
            {{range .Categories}}
            <option value="{{.ID}}">{{.Name}}</option>
            {{end}}
        </select>
    </label><br>
    <label>Дата: <input type="date" name="date" required></label><br>
    <button type="submit">Добавить</button>
</form>
{{end}}
