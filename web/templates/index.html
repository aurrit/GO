{{define "content"}}
<h2>Мои траты</h2>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Сумма</th>
        <th>Описание</th>
        <th>Дата</th>
    </tr>
    {{range .Expenses}}
    <tr>
        <td>{{.ID}}</td>
        <td>{{.Amount}}</td>
        <td>{{.Description}}</td>
        <td>{{.Date}}</td>
    </tr>
    {{end}}
</table>

<h3>Добавить трату</h3>
<form method="POST" action="/add">
    <label>Сумма: <input type="number" step="0.01" name="amount" required></label><br>
    <label>Описание: <input type="text" name="description" required></label><br>
    <label>Дата: <input type="date" name="date" required></label><br>
    <button type="submit">Добавить</button>
</form>
{{end}}
