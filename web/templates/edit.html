{{define "edit"}}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактировать трату</title>
</head>
<body>
    <h2>Редактировать трату</h2>
    <form method="POST" action="/update">
        <input type="hidden" name="id" value="{{.Expense.ID}}">
        <label>Сумма: <input type="number" step="0.01" name="amount" value="{{.Expense.Amount}}" required></label><br>
        <label>Описание: <input type="text" name="description" value="{{.Expense.Description}}" required></label><br>
        <label>Категория:
            <select name="category_id">
                <option value="0">Без категории</option>
                {{range .Categories}}
                <option value="{{.ID}}" {{if eq .ID $.Expense.CategoryID}}selected{{end}}>{{.Name}}</option>
                {{end}}
            </select>
        </label><br>
        <label>Дата: <input type="date" name="date" value="{{.Expense.Date}}" required></label><br>
        <button type="submit">Сохранить</button>
    </form>
    <a href="/">Назад к списку</a>
</body>
</html>
{{end}}
