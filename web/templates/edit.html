{{define "edit"}}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактировать трату</title>
</head>
<body>
    <h2>Редактировать трату</h2>
    <form method="POST" action="/update">
        <input type="hidden" name="id" value="{{.ID}}">
        <label>Сумма: <input type="number" step="0.01" name="amount" value="{{.Amount}}" required></label><br>
        <label>Описание: <input type="text" name="description" value="{{.Description}}" required></label><br>
        <label>Дата: <input type="date" name="date" value="{{.Date}}" required></label><br>
        <button type="submit">Сохранить</button>
    </form>
    <a href="/">Назад к списку</a>
</body>
</html>
{{end}}
